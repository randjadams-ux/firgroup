name: Build GotPrint Front

on:
  push:
    branches:
      - print-card-front-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: pip install pillow reportlab qrcode pypdf opencv-python-headless
      - name: Generate and validate production files
        run: python print-build/build_front.py
      - name: Upload GotPrint production front
        uses: actions/upload-artifact@v4
        with:
          name: Fir-Group-GotPrint-Front-Production
          path: |
            print-output/Fir-Group-GotPrint-Front-2100x1400-350DPI.png
            print-output/Fir-Group-GotPrint-Front-6x4-Print.pdf
            print-output/VALIDATION.txt
          if-no-files-found: error
