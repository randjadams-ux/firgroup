name: Build GotPrint Front

on:
  push:
    branches:
      - print-card-front-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: pip install pillow reportlab qrcode pypdf opencv-python-headless
      - name: Generate and validate production files
        run: python print-build/build_front.py
      - name: Upload GotPrint production front
        uses: actions/upload-artifact@v4
        with:
          name: Fir-Group-GotPrint-Front-Production-v5
          path: |
            print-output/Fir-Group-GotPrint-Front-v5-2100x1400-350DPI.png
            print-output/Fir-Group-GotPrint-Front-v5-6x4-Print.pdf
            print-output/VALIDATION-v5.txt
          if-no-files-found: error
      - name: Publish production files on this isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add print-output
          git commit -m "Publish validated GotPrint front [skip ci]"
          git push
